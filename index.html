<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบ QR Scan PEA - การไฟฟ้าส่วนภูมิภาคสาขาบัวเชด</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- QRCode Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.1/qrcode.min.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Sarabun', sans-serif;
    }
    @media print {
      body * {
        visibility: hidden;
      }
      .print-area, .print-area * {
        visibility: visible;
      }
      .print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
      @page {
        size: 50mm 30mm;
        margin: 0;
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const INITIAL_DATA = [
      {
        id: '1',
        caNo: '20012945981',
        name: 'นายปรีชา สิงห์ธีร์',
        address: 'เลขที่ 36/1 ม.4 บ.หมื่นสังข์ ต.สำเภาลูน อ.บัวเชด จ.สุรินทร์ 32230'
      }
    ];

    function App() {
      const [dataList, setDataList] = useState(() => {
        const saved = localStorage.getItem('pea_qr_scan_data_v11');
        return saved ? JSON.parse(saved) : INITIAL_DATA;
      });

      const [darkMode, setDarkMode] = useState(() => {
        return localStorage.getItem('pea_qr_theme') === 'dark';
      });

      useEffect(() => {
        localStorage.setItem('pea_qr_theme', darkMode ? 'dark' : 'light');
      }, [darkMode]);

      useEffect(() => {
        localStorage.setItem('pea_qr_scan_data_v11', JSON.stringify(dataList));
      }, [dataList]);

      const [printerName, setPrinterName] = useState('System Default');
      const [qrOffset, setQrOffset] = useState(110);
      const [labelWidth, setLabelWidth] = useState(50);
      const [labelHeight, setLabelHeight] = useState(30);

      const [isPrinterModalOpen, setIsPrinterModalOpen] = useState(false);
      const [isPasteModalOpen, setIsPasteModalOpen] = useState(false);
      const [isClearModalOpen, setIsClearModalOpen] = useState(false);
      const [pasteMode, setPasteMode] = useState('new');
      const [pasteText, setPasteText] = useState('');
      const [toastMessage, setToastMessage] = useState('');
      const [selectedSticker, setSelectedSticker] = useState(null);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3500);
      };

      const getQRPayload = (ca) => {
        const cleanCA = ca ? String(ca).trim() : '';
        return `|099400016550100\n0${cleanCA}\n00000\n00000`;
      };

      const handleProcessPaste = () => {
        if (!pasteText || !pasteText.trim()) {
          showToast('กรุณาวางข้อมูลข้อความในช่องก่อนกดยืนยัน');
          return;
        }

        const lines = pasteText.trim().split(/\r?\n/);
        const parsedItems = [];

        lines.forEach((line, idx) => {
          if (!line.trim()) return;
          let rawCols = line.split('\t').map(c => c.trim()).filter(Boolean);
          if (rawCols.length <= 1) {
            rawCols = line.split(/,{2,}| {2,}/).map(c => c.trim()).filter(Boolean);
          }

          if (rawCols.length > 0) {
            let caNo = '';
            const caMatch = line.match(/\b200\d+\b/);
            if (caMatch) {
              caNo = caMatch[0];
            }

            let cols = rawCols.filter(col => col !== caNo && !/^\b200\d+\b$/.test(col));
            const hasLetters = (str) => /[\u0E00-\u0E7Fa-zA-Z]/.test(str);
            const isAddressKeyword = (str) => /^(เลขที่|\d+\/\d+|ม\.|หมู่|บ\.|ต\.|ตำบล|อ\.|อำเภอ|จ\.|จังหวัด|ถ\.|ถนน|ซ\.|ซอย|\d{5})/i.test(str.trim());

            while (cols.length > 0 && !hasLetters(cols[0])) {
              cols.shift();
            }

            let nameParts = [];
            let addressParts = [];
            let isParsingAddress = false;

            cols.forEach((col) => {
              if (isAddressKeyword(col)) isParsingAddress = true;
              if (!isParsingAddress) {
                if (hasLetters(col)) nameParts.push(col);
                else {
                  isParsingAddress = true;
                  addressParts.push(col);
                }
              } else {
                addressParts.push(col);
              }
            });

            parsedItems.push({
              id: Date.now() + '_' + idx + '_' + Math.random().toString(36).substr(2, 4),
              caNo: caNo,
              name: nameParts.join(' ') || (cols[0] || '-'),
              address: addressParts.join(' ') || (cols.slice(nameParts.length).join(' ') || '-')
            });
          }
        });

        if (parsedItems.length > 0) {
          if (pasteMode === 'new') {
            setDataList(parsedItems);
            showToast(`วางใหม่สำเร็จ! ดึงข้อมูล ${parsedItems.length} รายการ`);
          } else {
            setDataList(prev => [...prev, ...parsedItems]);
            showToast(`วางเพิ่มสำเร็จ! รวมเป็น ${dataList.length + parsedItems.length} รายการ`);
          }
        } else {
          showToast('ไม่พบข้อมูลที่ตรงตามรูปแบบ');
        }

        setPasteText('');
        setIsPasteModalOpen(false);
      };

      const handleClearData = () => {
        setDataList([]);
        localStorage.removeItem('pea_qr_scan_data_v11');
        setIsClearModalOpen(false);
        showToast('ล้างข้อมูลในตารางเรียบร้อยแล้ว');
      };

      const handleAddRow = () => {
        const newItem = {
          id: Date.now().toString(),
          caNo: '20012945981',
          name: 'นายปรีชา สิงห์ธีร์',
          address: 'เลขที่ 36/1 ม.4 บ.หมื่นสังข์ ต.สำเภาลูน อ.บัวเชด จ.สุรินทร์'
        };
        setDataList(prev => [...prev, newItem]);
        showToast('เพิ่มแถวใหม่สำเร็จ');
      };

      const handleDeleteRow = (id) => {
        setDataList(prev => prev.filter(item => item.id !== id));
        showToast('ลบรายการเรียบร้อย');
      };

      const handleTriggerPrint = () => {
        if (dataList.length === 0) {
          showToast('ไม่มีข้อมูลในตารางสำหรับสั่งพิมพ์');
          return;
        }
        window.print();
      };

      return (
        <div className={`min-h-screen font-sans transition-colors duration-200 flex flex-col antialiased ${darkMode ? 'bg-slate-950 text-slate-100' : 'bg-slate-100 text-slate-800'}`}>
          
          {toastMessage && (
            <div className="fixed top-4 right-4 z-50 bg-purple-900 text-white px-4 py-3 rounded-2xl shadow-xl text-xs font-semibold flex items-center gap-2.5 animate-bounce border border-purple-700">
              <span>✓ {toastMessage}</span>
            </div>
          )}

          {/* HEADER */}
          <header className="print:hidden bg-gradient-to-r from-purple-950 via-purple-900 to-indigo-950 text-white shadow-md border-b border-purple-800/40">
            <div className="max-w-[1600px] mx-auto px-4 py-3 flex items-center justify-between flex-wrap gap-3">
              <div className="flex items-center gap-3">
                <div className="p-2 bg-amber-400 text-purple-950 rounded-2xl shadow-md font-bold">
                  🖨️
                </div>
                <div>
                  <h1 className="font-black text-lg tracking-wide text-amber-400">
                    ระบบ QR Scan PEA
                  </h1>
                  <p className="text-xs text-purple-200">การไฟฟ้าส่วนภูมิภาคสาขาบัวเชด</p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <div className="hidden sm:flex items-center gap-2 bg-purple-900/80 border border-purple-700/60 px-3 py-1.5 rounded-full text-xs text-purple-200 font-medium">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span>รองรับเครื่องพิมพ์ Label Thermal Printer 50x30mm</span>
                </div>

                <button
                  onClick={() => setDarkMode(!darkMode)}
                  className="p-2 rounded-2xl bg-purple-900/90 hover:bg-purple-800 border border-purple-700 text-amber-300 transition-all cursor-pointer flex items-center gap-2 px-3 text-xs font-bold"
                >
                  {darkMode ? '☀️ โหมดสว่าง' : '🌙 โหมดมืด'}
                </button>
              </div>
            </div>
          </header>

          {/* MAIN */}
          <main className="flex-1 p-4 md:p-6 max-w-[1600px] w-full mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 print:hidden">
            
            {/* TABLE SECTION */}
            <section className="lg:col-span-8 xl:col-span-9 space-y-4">
              <div className={`rounded-3xl shadow-sm border overflow-hidden ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                <div className={`p-4 border-b flex items-center justify-between flex-wrap gap-3 ${darkMode ? 'bg-slate-900/80 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
                  <div>
                    <h2 className={`font-bold text-sm md:text-base ${darkMode ? 'text-white' : 'text-slate-900'}`}>ตารางรายการผู้ใช้ไฟฟ้า</h2>
                    <p className={`text-xs ${darkMode ? 'text-slate-400' : 'text-slate-500'}`}>รวมทั้งสิ้น {dataList.length} รายการ | แก้ไขข้อมูลในตารางได้โดยตรง</p>
                  </div>
                  
                  <div className="flex items-center gap-2">
                    <button onClick={handleAddRow} className="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl shadow-sm cursor-pointer">
                      + เพิ่มแถว
                    </button>
                    <button onClick={() => { setPasteMode('new'); setIsPasteModalOpen(true); }} className="px-3.5 py-2 bg-purple-800 hover:bg-purple-900 text-white text-xs font-bold rounded-xl shadow-sm cursor-pointer">
                      📋 วางข้อมูล Excel
                    </button>
                  </div>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs border-collapse">
                    <thead>
                      <tr className="bg-purple-900 text-white font-bold">
                        <th className="p-3.5 w-12 text-center">ลำดับ</th>
                        <th className="p-3.5 w-48 border-r border-purple-800">หมายเลขผู้ใช้ไฟฟ้า (CA)</th>
                        <th className="p-3.5 w-64 border-r border-purple-800">ชื่อผู้ใช้ไฟฟ้า</th>
                        <th className="p-3.5 border-r border-purple-800">สถานที่ใช้ไฟฟ้า</th>
                        <th className="p-3.5 w-32 text-center border-r border-purple-800">ตัวอย่าง</th>
                        <th className="p-3.5 w-16 text-center">จัดการ</th>
                      </tr>
                    </thead>
                    <tbody className={`divide-y ${darkMode ? 'divide-slate-800 bg-slate-900' : 'divide-slate-200 bg-white'}`}>
                      {dataList.length === 0 ? (
                        <tr>
                          <td colSpan="6" className="text-center py-16 text-slate-400">ยังไม่มีข้อมูลในตาราง กดปุ่ม "วางข้อมูล Excel" เพื่อนำเข้า</td>
                        </tr>
                      ) : (
                        dataList.map((row, index) => (
                          <tr key={row.id} className={`transition-colors ${darkMode ? 'hover:bg-purple-950/30' : 'hover:bg-purple-50/40'}`}>
                            <td className="p-3 text-center font-mono text-slate-400">{index + 1}</td>
                            <td className="p-3 border-r font-mono font-bold text-sm">
                              <input 
                                type="text"
                                value={row.caNo}
                                onChange={e => {
                                  const val = e.target.value;
                                  setDataList(prev => prev.map(item => item.id === row.id ? { ...item, caNo: val } : item));
                                }}
                                className={`w-full bg-transparent border-b border-transparent focus:border-purple-600 px-1 py-0.5 rounded focus:outline-none ${!row.caNo || !row.caNo.startsWith('200') ? 'text-rose-500 italic' : ''}`}
                              />
                            </td>
                            <td className="p-3 border-r font-bold">
                              <input 
                                type="text"
                                value={row.name}
                                onChange={e => {
                                  const val = e.target.value;
                                  setDataList(prev => prev.map(item => item.id === row.id ? { ...item, name: val } : item));
                                }}
                                className="w-full bg-transparent border-b border-transparent focus:border-purple-600 px-1 py-0.5 rounded focus:outline-none"
                              />
                            </td>
                            <td className="p-3 border-r">
                              <input 
                                type="text"
                                value={row.address}
                                onChange={e => {
                                  const val = e.target.value;
                                  setDataList(prev => prev.map(item => item.id === row.id ? { ...item, address: val } : item));
                                }}
                                className="w-full bg-transparent border-b border-transparent focus:border-purple-600 px-1 py-0.5 rounded focus:outline-none"
                              />
                            </td>
                            <td className="p-3 text-center border-r">
                              <button onClick={() => setSelectedSticker(row)} className="px-2.5 py-1 rounded-xl text-xs font-bold bg-purple-100 hover:bg-purple-200 text-purple-900 cursor-pointer">
                                👁️ ดูฉลาก
                              </button>
                            </td>
                            <td className="p-3 text-center">
                              <button onClick={() => handleDeleteRow(row.id)} className="text-slate-400 hover:text-rose-600 cursor-pointer">
                                🗑️
                              </button>
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </section>

            {/* CONTROL PANEL */}
            <section className="lg:col-span-4 xl:col-span-3 space-y-4">
              <div className="bg-gradient-to-b from-purple-900 via-purple-950 to-slate-950 p-5 rounded-3xl shadow-xl border-4 border-purple-900 space-y-4 text-white">
                <div className="text-center border-b border-purple-800 pb-3">
                  <h3 className="font-black text-base">แผงควบคุมหลัก</h3>
                  <p className="text-[11px] text-purple-300">QRCodeCA Control Panel</p>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <button onClick={() => { setPasteMode('new'); setIsPasteModalOpen(true); }} className="py-4 px-2 bg-slate-200 hover:bg-white text-slate-900 font-black rounded-2xl shadow-lg border-b-4 border-slate-400 text-sm flex flex-col items-center cursor-pointer">
                    <span>วางใหม่</span>
                    <span className="text-[10px] text-slate-600">(Replace)</span>
                  </button>
                  <button onClick={() => { setPasteMode('append'); setIsPasteModalOpen(true); }} className="py-4 px-2 bg-slate-200 hover:bg-white text-slate-900 font-black rounded-2xl shadow-lg border-b-4 border-slate-400 text-sm flex flex-col items-center cursor-pointer">
                    <span>วางเพิ่ม</span>
                    <span className="text-[10px] text-slate-600">(Append)</span>
                  </button>
                </div>

                <button onClick={() => setIsPrinterModalOpen(true)} className="w-full py-3.5 px-3 bg-slate-200 hover:bg-white text-slate-900 font-black rounded-2xl shadow-lg border-b-4 border-slate-400 text-sm flex items-center justify-center gap-2 cursor-pointer">
                  ⚙️ Change Printer
                </button>

                <button onClick={handleTriggerPrint} disabled={dataList.length === 0} className="w-full py-4 px-3 bg-slate-200 hover:bg-white disabled:opacity-50 text-slate-900 font-black rounded-2xl shadow-lg border-b-4 border-slate-400 text-base flex flex-col items-center cursor-pointer">
                  <span>Print</span>
                  <span className="text-xs font-bold text-purple-950">ON: {printerName}</span>
                </button>

                <button onClick={() => setIsClearModalOpen(true)} className="w-full py-4 px-3 bg-rose-200 hover:bg-rose-100 text-rose-950 font-black rounded-2xl shadow-lg border-b-4 border-rose-400 text-xl tracking-wide flex items-center justify-center cursor-pointer">
                  Clear Data
                </button>
              </div>

              <div className={`p-4 rounded-3xl text-center space-y-2 border-2 ${darkMode ? 'bg-purple-950/50 border-purple-800' : 'bg-purple-200 border-purple-400'}`}>
                <label className="block text-xs font-bold leading-tight">
                  ปรับระยะ QR Code อยู่กึ่งกลาง (ค่าเริ่มต้น 110)
                </label>
                <div className="flex justify-center">
                  <input 
                    type="number"
                    value={qrOffset}
                    onChange={e => setQrOffset(Number(e.target.value))}
                    className="w-36 py-2 px-3 border-2 rounded-2xl text-center font-black text-2xl shadow-inner bg-white text-purple-950 focus:outline-none"
                  />
                </div>
              </div>
            </section>
          </main>

          {/* PRINT CONTAINER (Continuous Flow Layout) */}
          <div className="print-area hidden print:block text-black">
            {dataList.map((item, index) => (
              <div 
                key={item.id || index}
                style={{ width: `${labelWidth}mm`, height: `${labelHeight}mm`, pageBreakAfter: 'avoid', breakInside: 'avoid' }}
                className="p-1.5 box-border flex flex-col justify-between border border-black overflow-hidden bg-white"
              >
                <div className="flex justify-between items-center border-b border-black pb-0.5 text-[9px] font-bold">
                  <span>การไฟฟ้าส่วนภูมิภาคสาขาบัวเชด</span>
                  <span className="font-mono">CA: {item.caNo || ''}</span>
                </div>

                <div className="flex items-center gap-1.5 my-0.5">
                  <div className="flex-shrink-0">
                    <StickerQRCode text={getQRPayload(item.caNo)} size={54} />
                  </div>
                  <div className="flex-1 min-w-0 text-[8px] leading-tight space-y-0.5">
                    <p className="font-bold truncate text-black">{item.name}</p>
                    <p className="text-[7px] text-slate-800 line-clamp-2 leading-none">{item.address}</p>
                  </div>
                </div>

                <div className="border-t border-black pt-0.5 text-center min-h-[12px]"></div>
              </div>
            ))}
          </div>

          {/* PASTE MODAL */}
          {isPasteModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className={`rounded-3xl shadow-2xl border w-full max-w-xl p-6 space-y-4 ${darkMode ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-white border-slate-200 text-slate-800'}`}>
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-base">{pasteMode === 'new' ? 'วางใหม่ (Replace Paste)' : 'วางเพิ่ม (Append Paste)'}</h3>
                  <button onClick={() => setIsPasteModalOpen(false)} className="cursor-pointer text-slate-400">✕</button>
                </div>

                <div className="space-y-3">
                  <label className="block text-xs font-bold">วางตารางข้อมูลที่คัดลอกจาก Excel:</label>
                  <textarea 
                    rows="7"
                    value={pasteText}
                    onChange={e => setPasteText(e.target.value)}
                    placeholder="วางข้อมูลจาก Excel ที่นี่..."
                    className="w-full p-3.5 font-mono text-xs border rounded-2xl bg-slate-50 text-slate-900 focus:outline-none"
                  />
                </div>

                <div className="flex justify-end gap-2 pt-2 border-t">
                  <button onClick={() => setIsPasteModalOpen(false)} className="px-4 py-2 text-xs font-semibold cursor-pointer">ยกเลิก</button>
                  <button onClick={handleProcessPaste} className="px-5 py-2.5 text-xs font-bold bg-purple-900 hover:bg-purple-950 text-white rounded-xl shadow-md cursor-pointer">ยืนยัน</button>
                </div>
              </div>
            </div>
          )}

          {/* CLEAR CONFIRMATION MODAL (Replaces confirm()) */}
          {isClearModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className={`rounded-3xl shadow-2xl border w-full max-w-md p-6 space-y-4 ${darkMode ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-white border-slate-200 text-slate-800'}`}>
                <h3 className="font-bold text-base text-rose-600">ยืนยันการล้างข้อมูล</h3>
                <p className="text-xs">คุณต้องการล้างข้อมูลในตารางทั้งหมดใช่หรือไม่? ข้อมูลทั้งหมดจะถูกลบออกทันที</p>
                <div className="flex justify-end gap-2 pt-2 border-t">
                  <button onClick={() => setIsClearModalOpen(false)} className="px-4 py-2 text-xs font-semibold cursor-pointer">ยกเลิก</button>
                  <button onClick={handleClearData} className="px-5 py-2.5 text-xs font-bold bg-rose-600 hover:bg-rose-700 text-white rounded-xl shadow-md cursor-pointer">ยืนยันล้างข้อมูล</button>
                </div>
              </div>
            </div>
          )}

          {/* PRINTER SETTINGS MODAL */}
          {isPrinterModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className={`rounded-3xl shadow-2xl border w-full max-w-lg p-6 space-y-4 ${darkMode ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-white border-slate-200 text-slate-800'}`}>
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-base">ตั้งค่าเครื่องพิมพ์ (Change Printer)</h3>
                  <button onClick={() => setIsPrinterModalOpen(false)} className="cursor-pointer text-slate-400">✕</button>
                </div>

                <div className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold mb-1">เลือกเครื่องพิมพ์ในระบบ / ไดรเวอร์</label>
                    <select 
                      value={printerName}
                      onChange={e => setPrinterName(e.target.value)}
                      className="w-full p-3 text-xs font-semibold border rounded-xl bg-slate-50 text-slate-900 focus:outline-none"
                    >
                      <option value="System Default">System Default (เครื่องพิมพ์เริ่มต้นของระบบ Windows/Mac)</option>
                      <option value="PT330-331 Raster">PT330-331 Raster (Thermal Barcode Printer)</option>
                      <option value="Zebra ZD220 Direct Thermal">Zebra ZD220 Direct Thermal</option>
                      <option value="TSC TE200 Barcode Printer">TSC TE200 Barcode Printer</option>
                      <option value="Xprinter XP-365B Thermal">Xprinter XP-365B Thermal</option>
                    </select>
                  </div>
                </div>

                <div className="flex justify-end pt-3 border-t">
                  <button onClick={() => setIsPrinterModalOpen(false)} className="px-5 py-2.5 text-xs font-bold bg-purple-900 hover:bg-purple-950 text-white rounded-xl shadow-md cursor-pointer">บันทึก</button>
                </div>
              </div>
            </div>
          )}

          {/* PREVIEW SINGLE STICKER MODAL */}
          {selectedSticker && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className={`rounded-3xl shadow-2xl border w-full max-w-md p-6 space-y-4 ${darkMode ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-white border-slate-200 text-slate-800'}`}>
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-sm">ตัวอย่างฉลากสติ๊กเกอร์ 50x30mm</h3>
                  <button onClick={() => setSelectedSticker(null)} className="cursor-pointer text-slate-400">✕</button>
                </div>

                <div className="flex flex-col items-center py-2 space-y-3">
                  <div className="bg-white border-2 border-slate-900 p-3 rounded-xl shadow-md flex flex-col justify-between text-black w-72 h-44 box-border">
                    <div className="flex justify-between items-center border-b border-black pb-1 text-[9px] font-bold">
                      <span>การไฟฟ้าส่วนภูมิภาคสาขาบัวเชด</span>
                      <span className="font-mono">CA: {selectedSticker.caNo || ''}</span>
                    </div>

                    <div className="flex items-center gap-2 my-1">
                      <div className="p-1 bg-white">
                        <StickerQRCode text={getQRPayload(selectedSticker.caNo)} size={64} />
                      </div>
                      <div className="text-[10px] leading-tight space-y-1 min-w-0">
                        <p className="font-bold text-black truncate">{selectedSticker.name}</p>
                        <p className="text-[9px] text-slate-700 leading-tight line-clamp-3">{selectedSticker.address}</p>
                      </div>
                    </div>

                    <div className="border-t border-black pt-1 text-center min-h-[16px]"></div>
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-2 border-t">
                  <button onClick={() => setSelectedSticker(null)} className="px-4 py-2 text-xs font-semibold cursor-pointer">ปิด</button>
                  <button onClick={() => { setSelectedSticker(null); window.print(); }} className="px-4 py-2 text-xs font-bold bg-purple-900 hover:bg-purple-950 text-white rounded-xl shadow-md cursor-pointer">
                    🖨️ สั่งพิมพ์สติ๊กเกอร์นี้
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    function StickerQRCode({ text, size = 60 }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        if (window.QRCode && canvasRef.current && text) {
          try {
            window.QRCode.toCanvas(canvasRef.current, text, {
              width: size,
              margin: 1,
              color: { dark: '#000000', light: '#ffffff' }
            });
          } catch (err) {
            console.error("QR Code Error:", err);
          }
        }
      }, [text, size]);

      return <canvas ref={canvasRef} className="mx-auto rounded" />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
